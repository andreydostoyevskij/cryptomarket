<!DOCTYPE html>

<head>

  <link rel="stylesheet" href="templates/output.css">


  <script src="templates/app.js"></script>

  <title>CryptoFlow</title>
</head>
<body>
  

<nav class="bg-black text-white flex items-center justify-between">
  <div class="ml-5 flex p-4 items-center">
     <div class="text-2x1 font-bold text-white">CryptoFlow</div>
     </div> 
    <div class="">
    <ul class="bg-black flex space-x-6 text-lg font-medium">
      <li>
        <a href="#" class="text-red-500" aria-current="page">Cryptocurrencies</a>
      </li>
      <li>
        <a href="/trading" class="hover:text-red-500">Learn</a>
      </li>
      <li>
        <a href="/trading" class="hover:text-red-500">Trade</a>
      </li>
      <li>
        <a href="/account" class="hover:text-red-500 bg-black">Your wallet</a>
      </li>
      <li>
        <a href="#" class="hover:text-red-500">Contact</a>
      </li>
    </ul>
  </div>

  <div class="flex space-x-2">
    <button type="button" class="text-white bg-red-700 hover:bg-red-800 focus:ring-4 focus:ring-red-300 font-medium rounded-lg text-sm px-4 py-2 dark:bg-red-600 dark:hover:bg-red-700 dark:focus:ring-red-800">
      Sign up
    </button>
    <a href="/login"><button type="button" class="text-black bg-white hover:bg-gray-100 focus:ring-4 focus:ring-gray-300 font-medium rounded-lg text-sm px-4 py-2">
      Sign in
    </button>
    </a>
  </div>
</nav>
<div class="flex flex-col items-center justify-center mt-4 p-4">
    <p class="mt-4 p-4 text-lg text-gray-600">
      Explore the world of cryptocurrencies. Start your search below:
    </p>
</div>

</div>

  <!-- Search Bar -->
  <div class="search">
    <input
      type="text"
      id="searchInput"
      placeholder="Search for a cryptocurrency..."
    />
    <svg
      class="w-5 h-5 text-gray-500 dark:text-gray-400"
      xmlns="http://www.w3.org/2000/svg"
      fill="none"
      viewBox="0 0 20 20"
    >
      <path
        stroke="currentColor"
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2"
        d="m19 19-4-4m0-7A7 7 0 1 1 1 8a7 7 0 0 1 14 0Z"
      />
    </svg>
  <!-- Suggestions Dropdown -->
  <ul
    id="suggestions"
    class="absolute top-full left-0 right-0 mt-1 bg-white border rounded-lg shadow-lg hidden"
  ></ul>
</div>
